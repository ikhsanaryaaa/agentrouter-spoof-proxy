services:
  agentrouter-proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: agentrouter-proxy
    expose:
      - ${LISTEN_PORT:-8318}
    networks:
      - dokploy-network
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - /proxy
        - -healthcheck
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    environment:
      - LISTEN_PORT=${LISTEN_PORT:-8318}
      - LISTEN_ADDRESS=0.0.0.0
      - TARGET_HOST=${TARGET_HOST:-agentrouter.org}
      - TARGET_PORT=${TARGET_PORT:-443}
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-300000}
      - MODELS_CSV=${MODELS_CSV:-claude-opus-4-8,claude-opus-5,deepseek-v4-flash,glm-5.3,gpt-5.6-sol,gpt-6-astra}
      - WARMUP_INTERVAL_MS=${WARMUP_INTERVAL_MS:-180000}
      - MAX_RETRIES=${MAX_RETRIES:-2}
      - RETRY_DELAY_MS=${RETRY_DELAY_MS:-1000}
      - AR_API_KEY=${AR_API_KEY:-}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - DISCOVERY_INTERVAL_MS=${DISCOVERY_INTERVAL_MS:-600000}
      - INJECT_SYSTEM_PROMPT=${INJECT_SYSTEM_PROMPT:-}
      - SSE_IDLE_TIMEOUT_MS=${SSE_IDLE_TIMEOUT_MS:-600000}
      - SSE_CHUNK_TIMEOUT_MS=${SSE_CHUNK_TIMEOUT_MS:-30000}
      - RESPONSE_TIMEOUT_MS=${RESPONSE_TIMEOUT_MS:-30000}
      - BODY_UPLOAD_TIMEOUT_MS=${BODY_UPLOAD_TIMEOUT_MS:-60000}
      - SLOW_RESPONSE_MS=${SLOW_RESPONSE_MS:-30000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SPOOF_PROFILE=${SPOOF_PROFILE:-opencode}
      - PROXY_AUTH_TOKEN=${PROXY_AUTH_TOKEN:-}
      - EXPOSURE_MODE=${EXPOSURE_MODE:-auto}
      - CHECKIN_CMD=${CHECKIN_CMD:-uv}
      - CHECKIN_ARGS=${CHECKIN_ARGS:-run python checkin.py}
      - CHECKIN_WORKDIR=${CHECKIN_WORKDIR:-}
      - CHECKIN_SCHEDULE=${CHECKIN_SCHEDULE:-false}
      - CHECKIN_RANDOM_WINDOW_START=${CHECKIN_RANDOM_WINDOW_START:-08:00}
      - CHECKIN_RANDOM_WINDOW_END=${CHECKIN_RANDOM_WINDOW_END:-22:00}
    sysctls:
      - net.ipv4.tcp_keepalive_time=60
      - net.ipv4.tcp_keepalive_intvl=10
      - net.ipv4.tcp_keepalive_probes=3
    restart: unless-stopped
networks:
  dokploy-network:
    external: true
